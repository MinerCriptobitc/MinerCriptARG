<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinerCriptoARG</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto+Mono&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Roboto Mono',monospace;
background:#0b0f1e;
color:#e0e0e0;
text-align:center;
overflow-x:hidden;
}

header{
background:linear-gradient(135deg,#0d1a2a,#081021);
padding:50px 20px;
box-shadow:0 5px 20px rgba(0,0,0,0.5);
}

header h1{
font-family:'Orbitron',sans-serif;
font-size:42px;
color:#00f0ff;
margin-bottom:10px;
text-shadow:0 0 12px #00f0ff;
}

header p{font-size:18px;color:#a0c0ff}

.logo-container img{
width:220px;
margin:25px auto;
border-radius:15px;
}

section{padding:50px 20px}

.card{
background:rgba(20,35,60,0.85);
margin:25px auto;
padding:30px;
border-radius:20px;
width:90%;
max-width:750px;
backdrop-filter:blur(8px);
box-shadow:0 0 20px rgba(0,255,255,0.2);
transition:0.4s;
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 0 30px rgba(0,255,255,0.5);
}

h2{
color:#00f0ff;
font-family:'Orbitron',sans-serif;
margin-bottom:15px;
}

p,li{color:#c0dfff;font-size:16px;line-height:1.6}

ul{text-align:left;margin-left:20px}

button{
background:linear-gradient(135deg,#00f0ff,#0044ff);
border:none;
padding:12px 30px;
font-size:16px;
border-radius:30px;
cursor:pointer;
font-weight:bold;
color:#fff;
transition:0.3s;
margin-top:15px;
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 15px #00f0ff;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:none;
font-family:'Roboto Mono',monospace;
}

.btc-logo{
width:90px;
margin-bottom:15px;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);filter:drop-shadow(0 0 5px #f7931a)}
50%{transform:scale(1.1);filter:drop-shadow(0 0 20px #f7931a)}
100%{transform:scale(1);filter:drop-shadow(0 0 5px #f7931a)}
}

.btc-counter{
font-size:38px;
font-weight:bold;
color:#00ffcc;
margin-top:10px;
}

#cryptoRain{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}
</style>
</head>

<body>

<canvas id="cryptoRain"></canvas>

<div class="logo-container">
<img src="./logo.png" alt="Logo MinerCriptoARG">
</div>

<header>
<h1>MinerCriptoARG</h1>
<p>Infraestructura privada de minería de Bitcoin</p>
</header>

<section>

<div class="card">
<img class="btc-logo" src="https://upload.wikimedia.org/wikipedia/commons/4/46/Bitcoin.svg">
<h2>BTC Minados en USD</h2>
<div class="btc-counter" id="btcAmount">$3,927.00</div>
<p>Actualización automática progresiva</p>
</div>

<div class="card">
<h2>¿Querés sumarte?</h2>
<p>Solicitanos información completando el formulario:</p>

<form id="contactForm">
<input type="text" id="nombre" placeholder="Nombre" required>
<input type="text" id="apellido" placeholder="Apellido" required>
<input type="email" id="email" placeholder="Email" required>
<input type="text" id="telefono" placeholder="Teléfono (opcional)">
<button type="submit">Enviar por WhatsApp</button>
</form>

<button onclick="enviarMail()">Enviar por Email</button>

</div>

</section>

<footer>
© 2026 MinerCriptoARG - Proyecto privado independiente
</footer>

<script>

/* CONTADOR BTC */
let btcValue = 3927;
const btcDisplay = document.getElementById("btcAmount");

setInterval(()=>{
btcValue += 0.01;
btcDisplay.textContent = "$" + btcValue.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
},1000);

/* FORMULARIO WHATSAPP */
document.getElementById("contactForm").addEventListener("submit",function(e){
e.preventDefault();

let nombre=document.getElementById("nombre").value;
let apellido=document.getElementById("apellido").value;
let email=document.getElementById("email").value;
let telefono=document.getElementById("telefono").value;

let mensaje=`Nuevo interesado en MinerCriptoARG:%0A
Nombre: ${nombre}%0A
Apellido: ${apellido}%0A
Email: ${email}%0A
Telefono: ${telefono}`;

window.open(`https://wa.me/5491170663630?text=${mensaje}`,'_blank');
});

/* ENVIO POR MAIL */
function enviarMail(){
let nombre=document.getElementById("nombre").value;
let apellido=document.getElementById("apellido").value;
let email=document.getElementById("email").value;
let telefono=document.getElementById("telefono").value;

let asunto="Nuevo interesado MinerCriptoARG";
let cuerpo=`Nombre: ${nombre}\nApellido: ${apellido}\nEmail: ${email}\nTelefono: ${telefono}`;

window.location.href=`mailto:ferplate_medinaa@outlook.es?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
}

/* LLUVIA */
const canvas=document.getElementById('cryptoRain');
const ctx=canvas.getContext('2d');

function resizeCanvas(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);

const cryptos=['₿','Ξ','Ł','₮','Ƀ'];
const fontSize=26;
let columns=Math.floor(canvas.width/fontSize);
let drops=Array(columns).fill(1);

function draw(){
ctx.fillStyle='rgba(11,15,30,0.05)';
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle='#00f0ff';
ctx.font=fontSize+'px monospace';

for(let i=0;i<drops.length;i++){
const text=cryptos[Math.floor(Math.random()*cryptos.length)];
ctx.fillText(text,i*fontSize,drops[i]*fontSize);

if(drops[i]*fontSize>canvas.height && Math.random()>0.975){
drops[i]=0;
}
drops[i]++;
}
}

setInterval(draw,100);

</script>

</body>
</html>
