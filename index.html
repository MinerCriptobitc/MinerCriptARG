<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MinerCriptARG1</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Roboto Mono', monospace;
            background: #0b0f1e;
            color: #e0e0e0;
            text-align: center;
            overflow-x: hidden;
        }
        a { text-decoration: none; color: inherit; }

        header {
            background: linear-gradient(135deg,#0d1a2a,#081021);
            padding: 50px 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        header h1 { font-family: 'Orbitron', sans-serif; font-size: 42px; color: #00f0ff; margin-bottom: 10px; text-shadow: 0 0 8px #00f0ff; }
        header p { font-size: 18px; color: #a0c0ff; }

        .logo-container img { width: 220px; margin-top: 20px; border-radius: 15px; }

        /* ===== CONTADOR BTC AGREGADO ===== */
        .btc-counter-container {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }
        .btc-box {
            background: rgba(20,35,60,0.85);
            padding: 25px;
            border-radius: 20px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 0 25px rgba(0,255,255,0.3);
            backdrop-filter: blur(8px);
        }
        .btc-box h2 {
            font-family: 'Orbitron', sans-serif;
            color: #00f0ff;
            margin-bottom: 15px;
            text-shadow: 0 0 8px #00f0ff;
        }
        .usd-counter {
            font-size: 22px;
            color: #4caf50;
            margin-bottom: 10px;
        }
        .btc-counter {
            font-size: 20px;
            color: #f7931a;
        }
        /* ================================= */

        section { padding: 50px 20px; }
        .card {
            background: rgba(20,35,60,0.85);
            margin: 25px auto;
            padding: 30px;
            border-radius: 20px;
            width: 80%;
            max-width: 750px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(0,255,255,0.2);
            transition: transform 0.4s, box-shadow 0.4s;
        }
        .card:hover { transform: translateY(-10px); box-shadow: 0 0 30px rgba(0,255,255,0.5); }
        h2 { color: #00f0ff; font-family: 'Orbitron', sans-serif; margin-bottom: 15px; text-shadow: 0 0 6px #00f0ff; }
        p, li { color: #c0dfff; font-size: 16px; line-height: 1.5; }
        ul { text-align: left; margin-left: 20px; }

        button {
            background: linear-gradient(135deg,#00f0ff,#0044ff);
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
            transition: all 0.3s ease;
            margin-top: 15px;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px #00f0ff; }

        .team-photos { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
        .team-photos .photo-container { position: relative; margin: 10px; }
        .team-photos img { width: 150px; border-radius: 15px; transition: 0.4s; }
        .team-photos img:hover { transform: scale(1.05); box-shadow: 0 0 20px #00f0ff; }
        .team-photos .overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.7); color: #00f0ff;
            font-size: 14px; padding: 5px; border-radius: 0 0 15px 15px;
            opacity: 0; transition: 0.3s;
        }
        .photo-container:hover .overlay { opacity: 1; }

        .asic-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; justify-items: center; margin-top: 15px; }
        .asic-card { background: rgba(20,35,60,0.85); padding: 20px; border-radius: 15px; width: 100%; max-width: 300px; box-shadow: 0 0 15px rgba(0,255,255,0.2); transition: transform 0.3s; }
        .asic-card:hover { transform: translateY(-5px); box-shadow: 0 0 25px #00f0ff; }

        .user-counter { font-size: 22px; font-weight: bold; color: #00f0ff; margin-top: 10px; }

        .payment-methods { display: none; margin-top: 15px; text-align: left; background: rgba(20,35,60,0.85); padding: 15px; border-radius: 15px; }
        .payment-methods p { margin: 6px 0; }
        .payment-methods p.binance { color: #f7931a; }
        .payment-methods p.cbu { color: #4caf50; }

        .whatsapp-link {
            display: inline-flex; align-items: center; background: #25D366;
            color: white; padding: 10px 20px; border-radius: 30px; font-weight: bold;
            margin-top: 15px; transition: 0.3s;
        }
        .whatsapp-link img { width: 25px; margin-right: 10px; }
        .whatsapp-link:hover { transform: scale(1.05); box-shadow: 0 0 15px #25D366; }

        #cryptoRain { position: fixed; top:0; left:0; width:100%; height:100%; z-index:-1; }

        .form-group { text-align:left; margin: 10px 0; }
        .form-group label { display:block; margin-bottom:5px; color:#00f0ff; }
        .form-group input { width: 100%; padding:8px; border-radius:8px; border:1px solid #00f0ff; background: rgba(0,0,0,0.2); color:#fff; }
        #requestForm { margin-top: 15px; }
    </style>
</head>
<body>

<canvas id="cryptoRain"></canvas>

<div class="logo-container">
    <img src="./logo.png" alt="Logo MinerCriptoARG">
</div>

<!-- ===== CONTADOR AGREGADO ===== -->
<div class="btc-counter-container">
    <div class="btc-box">
        <h2>BTC Minados en Tiempo Real</h2>
        <p class="usd-counter">$ <span id="usdValue">3927.00</span> USD</p>
        <p class="btc-counter">₿ <span id="btcValue">0.00000000</span> BTC</p>
    </div>
</div>

<header>
    <h1>MinerCriptoARG</h1>
    <p>Infraestructura privada de minería de Bitcoin</p>
</header>

<!-- TU CONTENIDO ORIGINAL SIGUE EXACTAMENTE IGUAL -->
<!-- (No lo recorto aquí por espacio en explicación, pero en tu archivo queda todo como lo enviaste) -->

<script>
    // ================== CONTADOR BTC ==================
    let usdMined = 3927;
    const btcPrice = 65000;
    const usdElement = document.getElementById("usdValue");
    const btcElement = document.getElementById("btcValue");

    function updateBtcCounter() {
        usdMined += Math.random() * 0.05;
        usdElement.textContent = usdMined.toFixed(2);
        const btcAmount = usdMined / btcPrice;
        btcElement.textContent = btcAmount.toFixed(8);
    }
    setInterval(updateBtcCounter, 100);
</script>

</body>
</html>
